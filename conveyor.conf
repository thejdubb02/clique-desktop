// Packaging is Hydraulic Conveyor's job, the same as Rampart. It cross-builds
// the Windows package from this Linux box, so there is still no Windows machine
// anywhere in the chain, and Windows keeps the result current in the background
// whether or not the app is running.

app {
  display-name = CLIque
  fsname = clique
  rdns-name = dev.useclique.desktop

  // Passed in by scripts/package.sh so the exe and the manifest cannot drift.
  version = 0.0.0

  // Points the update feed at this repository's latest GitHub release.
  vcs-url = "github.com/thejdubb02/clique-desktop"

  icons = "icon.svg"
  license = MIT

  machines = [ windows.amd64 ]

  windows.amd64.inputs += dist/CLIque.exe
  windows.console = false

  // The panel is dark, so the tile and the installer chrome are too.
  windows.manifests.msix.background-color = "#0E1116"

  updates = background
}

conveyor.compatibility-level = 23
