// Packaging is Hydraulic Conveyor's job, the same as Rampart. It cross-builds
// the Windows package from this Linux box, so there is still no Windows machine
// anywhere in the chain, and Windows keeps the result current in the background
// whether or not the app is running.

app {
  display-name = CLIque
  fsname = clique
  rdns-name = dev.useclique.desktop

  // Passed in by scripts/package.sh so the exe and the manifest cannot drift.
  version = 0.0.0

  // Points the update feed at this repository's latest GitHub release.
  vcs-url = "github.com/thejdubb02/clique-desktop"

  icons = "icon.svg"
  license = MIT

  machines = [ windows.amd64 ]

  windows.amd64.inputs += dist/CLIque.exe
  windows.console = false

  // The panel is dark, so the tile and the installer chrome are too.
  windows.manifests.msix.background-color = "#0E1116"

  updates = background

  // The package's entry point must be our own exe.
  //
  // Conveyor otherwise makes updatecheck.exe the entry point, as an escape
  // hatch for the rare case where an update needs a full reinstall. For a JVM
  // app it knows what to launch afterwards. For a plain native binary it does
  // not, so launching the installed app ran the update check, showed a
  // "checking for updates" window, found nothing to do and exited without ever
  // starting CLIque. Reported 2026-09-18 as the app not opening at all.
  //
  // The trade is that the reinstall-required case is no longer handled. An app
  // that starts beats an app that handles a rare case and never starts.
  windows.manifests.msix.use-update-escape-hatch = false
}

conveyor.compatibility-level = 23
